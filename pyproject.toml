[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caspar-controller"
version = "1.1.1"
description = "Caspar Controller: run and control several CasparCG NDI outputs on one PC, from a web UI and an HTTP API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ITN"},
    {name = "BlueElliott", email = "elliott.ramdass10@gmail.com"},  # original author
]
keywords = ["casparcg", "ndi", "broadcast", "graphics", "control", "singular", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
ndi = [
    "ndi-python>=0.0.7",
    "numpy>=1.24.0",
]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
    "pytest-cov>=4.1.0",
    "ruff==0.17.3",  # pinned so CI, pre-commit and local formatting agree
    "pre-commit>=3.5.0",
    "bandit>=1.7.0",
]

build = [
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/itn-ltd/Elliotts-Caspar-Controller"
Repository = "https://github.com/itn-ltd/Elliotts-Caspar-Controller"
Issues = "https://github.com/itn-ltd/Elliotts-Caspar-Controller/issues"
Documentation = "https://github.com/itn-ltd/Elliotts-Caspar-Controller#readme"

[project.scripts]
caspar-controller = "caspar_controller.__main__:main"

[tool.setuptools.packages.find]
include = ["caspar_controller*"]

[tool.setuptools.package-data]
caspar_controller = ["static/*", "web/*"]
"caspar_controller.caspar" = ["test_patterns/*.png"]

# ==================== RUFF ====================
# Ruff is both the linter and the formatter (`ruff check .`, `ruff format .`).
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# Keep each file's existing line endings (Windows checkouts use CRLF).
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
]
ignore = [
    "E501",
]
# Never auto-delete "unused" variables: some are referenced by broken lambdas
# (see #5) and need fixing by hand, not removing.
unfixable = ["F841"]

[tool.ruff.lint.isort]
combine-as-imports = true

# ==================== PYTEST ====================
[tool.pytest.ini_options]
testpaths = ["tests"]
# Known-bad behaviour is pinned with xfail (tests/test_known_issues.py); strict
# means a fix makes the run fail until its xfail marker is removed.
xfail_strict = true

# ==================== BANDIT ====================
[tool.bandit]
exclude_dirs = [".venv", "venv", "build", "dist"]
skips = ["B101"]
