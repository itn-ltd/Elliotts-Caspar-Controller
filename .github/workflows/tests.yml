name: Tests

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    # Windows: the process tests launch real cmd.exe / CasparCG-style processes.
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Only tests/ for now: the app code has existing findings that the
      # Phase 1 restructure (#4) cleans up, after which this covers everything.
      - name: Lint tests
        run: ruff check tests

      - name: Test
        run: pytest -ra
