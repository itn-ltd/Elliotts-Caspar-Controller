name: CI

# Lint, format check and tests on every pull request, whatever its target branch
# (phase branches into feature/v2-refactor, and that branch into master).
# Builds and releases live in build.yml and only run on master.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    # Windows: the process tests launch real cmd.exe / CasparCG-style processes.
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check . --output-format github

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest -ra
