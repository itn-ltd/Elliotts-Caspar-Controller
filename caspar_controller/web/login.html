<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Elliott's Caspar Controller</title>
<link rel="stylesheet" href="/web/app.css"></head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh">
<div class="card" style="width:380px;padding:32px">
  <h1 style="margin-bottom:4px">Elliott's Caspar Controller</h1>
  <p style="color:var(--muted);font-size:14px" data-server-name hidden></p>
  
  <div style="margin-top:24px">
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="pw" placeholder="Enter password" autofocus>
  </div>
  <button class="btn btn-primary" style="width:100%" onclick="submit()">Sign In</button>
  <p id="form-error" style="color:var(--error);font-size:13px;margin-top:12px"></p></div>
</div>
<script src="/web/app.js"></script>
<script>
function submit() { submitPassword('/login', document.getElementById('pw').value); }</script>
</body></html>
