<!DOCTYPE html>
<html lang="en" class="dark"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change password — Elliott's Caspar Controller</title>
<link rel="stylesheet" href="/web/app.css"></head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh">
<div class="card card-sign-in">
  <h1 class="brand-title" style="margin-bottom:4px">Elliott's Caspar Controller</h1>
  <p style="color:var(--text-muted);font-size:14px" data-server-name hidden></p>
  
  <div style="margin-top:24px">
  <p style="color:var(--text-muted);margin-bottom:16px">Choose a new password to continue.</p>
  <div class="form-group">
    <label>New password</label>
    <input type="password" id="pw" autofocus>
  </div>
  <div class="form-group">
    <label>Confirm new password</label>
    <input type="password" id="pw2">
  </div>
  <button class="btn btn-cta" style="width:100%" onclick="submit()">Save and continue</button>
  <p id="form-error" style="color:var(--error);font-size:13px;margin-top:12px"></p></div>
</div>
<script src="/web/app.js"></script>
<script>
function submit() {
  const pw = document.getElementById('pw').value;
  if (pw !== document.getElementById('pw2').value) {
    document.getElementById('form-error').textContent = "Passwords don't match";
    return;
  }
  submitPassword('/api/password', pw);
}</script>
</body></html>
